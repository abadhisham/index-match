function show(){
  const z=$("quiz");$("bar").style.width=(qi/Q.length*100)+"%";
  if(qi>=Q.length){
    z.innerHTML=`
      <div class="big">${T(S.sc)} ${sc} / ${Q.length}</div>
      <p>${T(S[sc===Q.length?"r3":sc>=28?"r2":"r1"])}</p>
      <div style="margin: 16px 0;">
        <label for="studentName" style="margin-bottom:6px; font-weight:600;"></label>
        <input type="text" id="studentName" placeholder="e.g. Budi Santoso" style="width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; background:var(--solid); color:var(--ink); margin-bottom:10px; font:inherit;">
        <button id="sendScoreBtn" style="width:100%;"></button>
        <div id="sendStatus" style="margin-top:8px; font-size:0.9rem;"></div>
      </div>
      <button id="re">${T(S.again)}</button>
    `;
    
    $("studentName").previousElementSibling.textContent = lang==="en" ? "Enter Your Full Name:" : "Masukkan Nama Lengkap Anda:";
    $("sendScoreBtn").textContent = lang==="en" ? "Submit Score to Teacher" : "Kirim Nilai ke Guru";

    $("sendScoreBtn").onclick = () => {
      const namaSiswa = $("studentName").value.trim();
      if(!namaSiswa) { alert(lang==="en" ? "Please enter your name first!" : "Mohon masukkan nama Anda terlebih dahulu!"); return; }
      $("sendScoreBtn").disabled = true;
      $("sendStatus").textContent = lang==="en" ? "Sending score..." : "Mengirim nilai...";

      const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxxZD6et1eM3XyqO9BKHYEEGKu67Mo56BIXAi0gqEQOjZVZewHob9fgvMv1gn6XG38K/exec";

      fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nama: namaSiswa, skor: sc, total: Q.length }) })
      .then(() => {
        $("sendStatus").style.color = "var(--g)";
        $("sendStatus").innerHTML = lang==="en" ? "<b>Success!</b> Your score has been recorded." : "<b>Berhasil!</b> Nilai Anda telah tercatat di rekap guru.";
        $("sendScoreBtn").textContent = lang==="en" ? "Submitted ✓" : "Terkirim ✓";
      })
      .catch(err => {
        $("sendStatus").style.color = "var(--err)";
        $("sendStatus").textContent = lang==="en" ? "Failed to send. Please try again." : "Gagal mengirim. Silakan coba lagi.";
        $("sendScoreBtn").disabled = false;
      });
    };

    $("re").onclick=()=>{qi=0;sc=0;show()};return;
  }
  const q=Q[qi];
  const opts = q.o[lang==="en"?0:1];
  z.innerHTML=(q.c?`<div class="cw">${q.c()}</div>`:"")+`<p><b>${T(S.qn)} ${qi+1} ${T(S.of)} ${Q.length}.</b> ${T(q.q)}</p>`+opts.map((x,k)=>`<button class="opt" data-k="${k}">${x}</button>`).join("")+`<div id="fb"></div>`;
  z.querySelectorAll(".opt").forEach(b=>b.onclick=()=>done(+b.dataset.k===q.a,b));
}

function done(ok,btn){
  const q=Q[qi];if(ok)sc++;
  document.querySelectorAll("#quiz .opt").forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("ok");else if(b===btn)b.classList.add("no")});
  $("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${T(ok?S.co:S.wr)}</b> ${T(q.e)}</div><button id="nx">${T(qi===Q.length-1?S.fin:S.next)}</button>`;
  $("nx").focus();$("nx").onclick=()=>{qi++;show()};
}

function fill(){
  const v=$("ds").value||0;
  $("ds").innerHTML=SIM_DATA.map((d,i)=>`<option value="${i}">${T(d.n)}</option>`).join("");
  $("ds").value=v;
}

function chips(){
  $("ty").innerHTML=["idx","left","matrix"].map((k,i)=>`<button class="chip" data-t="${k}" aria-pressed="${k===ty}">${T(S.ty[i])}</button>`).join("");
}

function drawSimulator(){
  const d = SIM_DATA[ty === "idx" ? 0 : ty === "left" ? 1 : 2];
  $("formulaText").textContent = d.formula;
  
  let html = `<thead><tr><th>#</th>`;
  const headers = T(d.headers);
  headers.forEach((h, idx) => {
    html += `<th>${String.fromCharCode(65 + idx)}<br><span style="font-size:0.8rem; font-weight:normal;">${h}</span></th>`;
  });
  html += `</tr></thead><tbody>`;

  d.rows.forEach((row, rIdx) => {
    html += `<tr><td style="background:var(--gl); font-weight:600; text-align:center;">${rIdx + 1}</td>`;
    row.forEach((cell, cIdx) => {
      let isHighlight = (rIdx + 1 === d.highlightRow && cIdx === d.highlightCol);
      html += `<td class="${isHighlight ? 'highlight-cell' : ''}">${cell}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody>`;
  $("sheetTable").innerHTML = html;

  const descIdx = lang === "en" ? 0 : 1;
  $("hasil").className = "res ok";
  $("hasil").innerHTML = `<span class="bd">✓</span><span><b>${T(K.ok)}</b> ${d.desc[descIdx]} (<b>Result: ${d.res}</b>)</span>`;
}

function apply(){
  document.documentElement.lang=lang;
  document.title=T(S.title);
  document.querySelectorAll("[data-i]").forEach(e=>e.innerHTML=T(S[e.dataset.i]));
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  
  $("tb").innerHTML=`<tr>${S.th.map(h=>`<th>${T(h)}</th>`).join("")}</tr>`+ROWS.map(r=>`<tr>${r.map((c,j)=>`<td>${j?T(c):"<b>"+T(c)+"</b>"}</td>`).join("")}</tr>`).join("");
  fill();
  chips();
  drawSimulator();
  show();
}

document.querySelector(".seg").onclick=e=>{
  const b=e.target.closest("button");
  if(!b)return;
  lang=b.dataset.l;
  try{localStorage.setItem("lg",lang)}catch(x){}
  apply();
};

$("ty").onclick=e=>{
  const b=e.target.closest("button");
  if(!b)return;
  ty=b.dataset.t;
  chips();
  drawSimulator();
};

$("ds").addEventListener("input",e=>{
  const val = +$("ds").value;
  ty = val === 0 ? "idx" : val === 1 ? "left" : "matrix";
  chips();
  drawSimulator();
});

$("th").onclick=()=>{
  const r=document.documentElement,
        cur=r.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),
        nx=cur==="dark"?"light":"dark";
  r.dataset.theme=nx;
  try{localStorage.setItem("th",nx)}catch(x){}
};

apply();
</script>
